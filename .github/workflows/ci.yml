name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache Zig toolchain and packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            .tools
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'scripts/build-libghostty.sh', 'patches/**') }}
          restore-keys: zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Metal toolchain (precompiled shaders)
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal toolchain unavailable; shaders will be compiled at runtime"

      - name: Build
        run: ./scripts/ci-run.sh make app

      - name: Smoke test
        run: |
          set -euo pipefail
          G=build/Ghostdrop.app/Contents/MacOS/ghostdrop
          codesign --verify --strict build/Ghostdrop.app
          GHOSTDROP_CONFIG="$RUNNER_TEMP/gd/config" "$G" check
          # Fresh runner has no Ghostty config: Ghostdrop must not create Ghostty files.
          test ! -e "$HOME/Library/Application Support/com.mitchellh.ghostty/config.ghostty"
          "$G" +version
          test -f build/Ghostdrop.app/Contents/Resources/AGENTS.md
          test -f build/Ghostdrop.app/Contents/Resources/terminfo/78/xterm-ghostty

      - name: macOS callback & prompt tests
        run: ./scripts/ci-run.sh make test

  linux:
    name: linux (Arch, makepkg)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      # git first, so checkout fetches the submodule with git.
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust clang pkgconf \
            libglvnd libxcb libxkbcommon libxkbcommon-x11 fontconfig \
            mesa xorg-server-xvfb
          useradd -m builder

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache Zig packages and crates
        uses: actions/cache@v6
        with:
          path: |
            packaging/arch/src/zig-cache
            packaging/arch/src/cargo-home
          key: linux-${{ hashFiles('patches/**', 'linux/Cargo.lock', 'packaging/arch/PKGBUILD') }}
          restore-keys: linux-

      - name: makepkg
        run: |
          chown -R builder: "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder env PKGDEST="$PWD" makepkg --noconfirm

      - name: Linux FFI boundary & unit tests
        run: |
          sudo -u builder env \
            CARGO_HOME="$GITHUB_WORKSPACE/packaging/arch/src/cargo-home" \
            CARGO_FLAGS="--frozen" \
            GHOSTTY_DIR="$GITHUB_WORKSPACE/packaging/arch/src/ghostdrop/build/ghostty-linux" \
            ./scripts/ci-run.sh ./dev/ci/linux-test.sh

      - name: Install and smoke test
        run: |
          pacman -U --noconfirm packaging/arch/ghostdrop-*.pkg.tar.*
          dev/ci/linux-smoke.sh
